<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versi Terbaru - Ekonomi Map</title>
    <style>
        /* Reset & Tampilan Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000; /* Background Full Hitam */
            font-family: 'Montserrat', 'Arial Black', sans-serif;
            display: flex;
            justify-content: center; /* Posisikan Tengah Horizontal */
            align-items: center;     /* Posisikan Tengah Vertikal */
            min-height: 100vh;
            overflow: hidden;
        }

        /* Styling Kotak Tombol Bercahaya */
        .glow-button {
            display: inline-block;
            padding: 30px 60px;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 900; /* Font Besar dan Tegas */
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            letter-spacing: 2px;
            border: 4px solid #00f0ff;
            border-radius: 16px;
            background-color: rgba(0, 240, 255, 0.05);
            
            /* Efek Cahaya / Glow */
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6),
                        0 0 40px rgba(0, 240, 255, 0.3),
                        inset 0 0 20px rgba(0, 240, 255, 0.4);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
            
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }

        /* Efek Saat Kursor diarahkan (Hover) */
        .glow-button:hover {
            background-color: #00f0ff;
            color: #000000; /* Teks berubah hitam agar kontras */
            text-shadow: none;
            box-shadow: 0 0 30px #00f0ff,
                        0 0 60px #00f0ff,
                        0 0 100px #00f0ff;
            transform: scale(1.05); /* Sedikit membesar */
        }

        /* Efek Saat Ditekan/Klik */
        .glow-button:active {
            transform: scale(0.98);
        }

        /* Penyesuaian Tampilan untuk Layar HP */
        @media (max-width: 600px) {
            .glow-button {
                font-size: 1.4rem;
                padding: 20px 30px;
                border-width: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- Tombol Utama yang Mengarah ke Website -->
    <a href="https://ekonomi-map.netlify.app/" class="glow-button">
        Versi Terbaru Klik disini
    </a>

</body>
</html>
